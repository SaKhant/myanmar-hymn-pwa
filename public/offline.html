<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#456b57">
  <title>Hymn App · Offline</title>
  <style>
    :root{--paper:#fbfaf6;--ink:#25322b;--muted:#68736c;--line:#e4e5dc;--sage:#456b57;--soft:#e9f0e9;--gold:#9b7541;--red:#c83f45} @media(prefers-color-scheme:dark){:root{--paper:#151a17;--ink:#edf1eb;--muted:#aab4ad;--line:#303a33;--sage:#95bda3;--soft:#223229;--gold:#d8b67b;--red:#ff6b70}} *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Padauk","Myanmar Text","Noto Sans Myanmar",sans-serif}.page{width:min(100% - 2rem,72rem);margin:auto;padding:2rem 0 6rem}.my{font-family:"Padauk","Myanmar Text","Noto Sans Myanmar",sans-serif;line-height:1.8}.eyebrow{color:var(--gold);font-size:.74rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{font-family:Georgia,serif;font-size:2.5rem;margin:.4rem 0}a{color:inherit;text-decoration:none}.surface{border:1px solid var(--line);background:color-mix(in srgb,var(--paper) 92%,var(--soft));border-radius:1.1rem}.notice{padding:1rem;margin-bottom:1rem;color:var(--muted)}.search{display:flex;margin:1.25rem 0}.search input{width:100%;min-height:3rem;border:1px solid var(--line);border-radius:.85rem;background:var(--paper);color:var(--ink);padding:0 .9rem;font:inherit}.row{display:flex;align-items:center;gap:1rem;min-height:4rem;padding:.8rem .25rem;border-bottom:1px solid var(--line)}.number{width:3rem;flex:none;text-align:center;color:var(--gold);font-family:Georgia,serif;font-size:1.2rem}.muted{color:var(--muted)}.grid{display:grid;gap:.75rem}.card{padding:1.1rem}.refs{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.8rem}.ref{border-radius:1rem;background:var(--soft);color:var(--sage);padding:.35rem .65rem;font-size:.78rem;font-weight:bold}.reader{width:min(100% - 2rem,56rem)}.reader h1{font-size:2rem}.section{margin:1.5rem 0}.label{color:var(--gold);font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em}.section p{margin:.25rem 0;min-height:1.5em;line-height:1.8}.chorus{border-left:2px solid var(--gold);padding-left:1rem}.toolbar{display:flex;gap:.4rem;margin:1rem 0}.button{min-height:2.75rem;border:1px solid var(--line);border-radius:.75rem;background:transparent;color:var(--ink);padding:.55rem .85rem;font-weight:bold}.primary{background:var(--sage);color:white}.nav{position:fixed;z-index:5;inset:auto 0 0;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--paper);padding-bottom:env(safe-area-inset-bottom)}.nav a{text-align:center;padding:.85rem .2rem;font-size:.72rem;color:var(--muted)}.nav a.active{color:#3478c7;font-weight:bold}.empty{text-align:center;padding:4rem 1rem}.details{margin-top:1.5rem;padding:1rem}.details p{margin:.35rem 0}.status{font-weight:bold;color:var(--sage)}@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}.page{padding-top:3rem}.nav{left:auto;top:0;width:11rem;grid-template-columns:1fr;align-content:center;border-left:1px solid var(--line);border-top:0}.page{padding-right:12rem}}
  </style>
</head>
<body><main id="app" class="page"><p class="notice surface">Loading offline hymn library…</p></main>
<nav class="nav" aria-label="Main navigation"><a href="/" data-root="hymns">Hymns</a><a href="/yp" data-root="yp">YP Songs</a><a href="/favorites" data-root="favorites">Favorites</a><a href="/settings" data-root="settings">Settings</a></nav>
<script>
const DB="hymn-house-offline",HYMNS="hymns",CATEGORIES="categories",META="metadata",FAV="hymn-house:favorites",FONT="hymn-house:font-size";let hymns=[],categories=[],meta=null;
const app=document.getElementById("app"),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function openDb(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function all(store){return new Promise((ok,no)=>{const r=store.getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function collection(kind,lang){return `${lang==="my"?"myanmar":"english"}_${kind}`}
function find(kind,lang,id){return hymns.find(h=>h.collection===collection(kind,lang)&&(h.id===id||String(h.number)===id))}
function title(h){return h.title?.trim()||h.first_line?.trim()||`Hymn ${h.number??h.id}`}
function normalize(v){return String(v??"").normalize("NFC").trim().replace(/\s+/g," ").toLowerCase()}
function numberQuery(v){const n=normalize(v).replace(/[၀-၉]/g,d=>String("၀၁၂၃၄၅၆၇၈၉".indexOf(d)));return /^\d+$/.test(n)?n:null}
function href(kind,lang,h){return `/${kind}/${lang}/${h.id}`}
const burmeseCategoryFallbacks={Divine_Healing:"အနာရောဂါငြိမ်းစေခြင်း",Prayer:"ဆုတောင်းခြင်း",Study_of_the_Word:"နှုတ်ကပတ်တော်လေ့လာခြင်း",The_Church:"အသင်းတော်",Meetings:"စုဝေးခြင်းများ",Spiritual_Warfare:"ဝိညာဉ်ရေးရာတိုက်ပွဲ",Service:"အမှုတော်ဆောင်ခြင်း",Preaching_of_the_Gospel:"ဧဝံဂေလိတရားဟောပြောခြင်း",Baptism:"ဗတ္တိဇံ",The_Lord_s_Day:"သခင်ဘုရား၏နေ့",The_Kingdom:"နိုင်ငံတော်",Hope_of_Glory:"ဘုန်းတော်မျှော်လင့်ခြင်း",Ultimate_Manifestation:"နောက်ဆုံးထင်ရှားပေါ်ထွန်းခြင်း",Gospel:"ဧဝံဂေလိတရား",The_Word_of_God:"ဘုရားသခင်၏နှုတ်ကပတ်တော်",Others:"အခြားများ",Preaching_the_Gospel:"ဧဝံဂေလိတရားဟောပြောခြင်း"};
function categoryNumber(c){const m=String(c).match(/^\s*(\d+)/);return m?Number(m[1]):Number.POSITIVE_INFINITY}function categoryTitle(c){if(/[\u1000-\u109f]/u.test(c.category))return c.category;return `${categoryNumber(c.category)}. ${burmeseCategoryFallbacks[c.slug]??c.category.replace(/^\s*\d+\.\s*/,"").replace(/\s*\[\d+\]\s*$/,"")}`}
function nav(root){document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("active",a.dataset.root===root))}
function layout(eyebrow,heading,content,root="hymns",reader=false){app.className=`page${reader?" reader":""}`;app.innerHTML=`<p class="eyebrow">${esc(eyebrow)}</p><h1>${esc(heading)}</h1>${content}`;nav(root)}
function list(kind){const source=hymns.filter(h=>h.collection===collection(kind,"my")&&(kind!=="hymns"||Number.isInteger(h.number))).sort((a,b)=>(a.number??Number.MAX_SAFE_INTEGER)-(b.number??Number.MAX_SAFE_INTEGER));const heading=kind==="yp"?"YP Songs":"Hymns",root=kind==="yp"?"yp":"hymns";layout(kind==="yp"?"Songs of Enjoyment":"Hymnal.net",heading,`<p class="notice surface">Offline Library · Audio requires internet</p><div class="search"><input id="search" placeholder="Search number, title, or lyric…"></div><p id="count" class="muted"></p><div id="rows"></div>`,root);const input=document.getElementById("search"),rows=document.getElementById("rows"),count=document.getElementById("count");const render=()=>{const q=normalize(input.value),n=numberQuery(q);const result=!q?source:source.filter(h=>n!==null?String(h.number??"").includes(n):normalize([title(h),h.first_line,h.lyrics_text].join(" ")).includes(q));count.textContent=`${result.length.toLocaleString()} ${result.length===1?"song":"songs"}`;rows.innerHTML=result.map(h=>`<a class="row" href="${href(kind,"my",h)}"><span class="number">${esc(h.number??"—")}</span><strong class="my">${esc(title(h))}</strong></a>`).join("")||`<div class="empty">No songs found</div>`};input.addEventListener("input",render);render()}
function categoryPage(){layout("Myanmar hymn book","Categories",`<p class="notice surface">Offline Library</p><div class="grid">${categories.slice().sort((a,b)=>categoryNumber(a.category)-categoryNumber(b.category)).map(c=>`<section class="surface card"><strong class="my">${esc(categoryTitle(c))}</strong><div class="refs">${c.hymns.slice().sort((a,b)=>a.number-b.number).map(r=>`<a class="ref" href="/hymns/my/${r.number}">${r.number}</a>`).join("")}</div></section>`).join("")}</div>`,"hymns")}
function chord(line){const token=/^[A-G](?:#|b)?(?:(?:maj|min|m|dim|aug|sus|add)?\d*(?:\([^)]*\))?)?(?:\/[A-G](?:#|b)?)?$/i,p=line.trim().replace(/[|,:()\-–—]/g," ").split(/\s+/).filter(Boolean);return p.length&&p.every(t=>token.test(t))}
function referenceLinks(h,kind,lang){if(kind==="hymns"&&lang==="my"){const n=h.cross_references?.Eng?.match(/^(\d+)/)?.[1],e=n&&find("hymns","en",n);return `MY ${esc(h.number??h.id)}${e?` · <a href="${href("hymns","en",e)}">ENG ${esc(h.cross_references.Eng)}</a>`:""}`}if(kind==="hymns"){const m=hymns.find(x=>x.collection==="myanmar_hymns"&&x.cross_references?.Eng?.match(/^(\d+)/)?.[1]===String(h.number??h.id));return `${m?`<a href="${href("hymns","my",m)}">MY ${esc(m.number??m.id)}</a> · `:""}ENG ${esc(h.number??h.id)}`}const n=h.cross_references?.["New Songs"],other=n&&find("yp",lang==="my"?"en":"my",n);return `${lang==="my"?"MY":"ENG"} ${esc(h.number??h.id)}${other?` · <a href="${href("yp",lang==="my"?"en":"my",other)}">${lang==="my"?"ENG":"MY"} ${esc(other.number??other.id)}</a>`:""}`}
function shareText(h,kind,lang){return `${kind==="yp"?"YP ":""}${lang==="my"?"MY":"ENG"} ${h.number??h.id}\n\n${title(h)}\n\n${h.sections.map(s=>`${s.type==="verse"?`Verse ${s.number??""}`:s.type}\n${s.lines.filter(l=>kind!=="yp"||!chord(l)).join("\n")}`).join("\n\n")}`}
function reader(kind,lang,id){const h=find(kind,lang,id);if(!h){layout("Offline Library","Hymn not found",`<p class="notice surface">This reference does not exist in the downloaded collection.</p>`,kind==="yp"?"yp":"hymns");return}const my=lang==="my",size=Number(JSON.parse(localStorage.getItem(FONT)||"20"));const sections=h.sections.map(s=>`<section class="section ${s.type==="chorus"||s.type==="refrain"?"chorus":""}"><p class="label">${esc(s.type==="verse"?`Verse ${s.number??""}`:s.type)}</p>${s.lines.filter(l=>kind!=="yp"||!chord(l)).map(l=>`<p class="${my?"my":""}">${esc(l)}</p>`).join("")}</section>`).join("");const details=Object.entries(h.metadata||{}).map(([k,v])=>`<p><strong>${esc(k)}:</strong> ${esc(v)}</p>`).join("");layout("",title(h),`<p class="notice surface">Offline Library · Audio requires an internet connection</p><div class="toolbar"><button class="button" id="fav">♡ Favorite</button><button class="button" id="minus">−</button><button class="button" id="plus">+</button><button class="button" id="copy">Copy text</button></div><article id="lyrics" style="font-size:${size}px">${sections}</article>${details?`<details class="surface details"><summary>Hymn Details</summary>${details}</details>`:""}`,kind==="yp"?"yp":"hymns",true);document.querySelector(".eyebrow").innerHTML=referenceLinks(h,kind,lang);const key=`${kind}-${lang}-${h.id}`;const favs=()=>JSON.parse(localStorage.getItem(FAV)||"[]");const fav=document.getElementById("fav");const sync=()=>fav.textContent=favs().some(x=>`${x.kind}-${x.language}-${x.id}`===key)?"♥ Favorited":"♡ Favorite";fav.onclick=()=>{const a=favs(),exists=a.some(x=>`${x.kind}-${x.language}-${x.id}`===key),next=exists?a.filter(x=>`${x.kind}-${x.language}-${x.id}`!==key):[{id:h.id,kind,language:lang,number:h.number,title:title(h)},...a];localStorage.setItem(FAV,JSON.stringify(next));sync()};sync();const lyrics=document.getElementById("lyrics"),setSize=d=>{const n=Math.max(16,Math.min(32,(parseInt(lyrics.style.fontSize)||20)+d));lyrics.style.fontSize=`${n}px`;localStorage.setItem(FONT,JSON.stringify(n))};document.getElementById("minus").onclick=()=>setSize(-2);document.getElementById("plus").onclick=()=>setSize(2);document.getElementById("copy").onclick=async e=>{await navigator.clipboard.writeText(shareText(h,kind,lang));e.currentTarget.textContent="Copied ✓"}}
function favorites(){const items=JSON.parse(localStorage.getItem(FAV)||"[]");layout("Your collection","Favorites",items.length?items.map(h=>`<a class="row" href="/${h.kind}/${h.language}/${h.id}"><span class="number">${esc(h.number??"♪")}</span><span><strong class="${h.language==="my"?"my":""}">${esc(h.title)}</strong><small class="muted" style="display:block">${h.language==="my"?"Myanmar":"English"} · ${h.kind==="yp"?"YP Song":"Hymn"}</small></span></a>`).join(""):`<div class="empty">Your favorites are waiting</div>`,"favorites")}
function settings(){layout("Offline","Settings",`<section class="surface card"><h2>Offline Library</h2><p class="status">Downloaded ✓</p><p class="muted">Version ${esc(meta.version)} · ${hymns.length.toLocaleString()} songs · ${categories.length} categories</p><p class="muted">Audio requires an internet connection.</p></section>`,"settings")}
function route(){const p=location.pathname.split("/").filter(Boolean);if(!p.length)return list("hymns");if(p[0]==="yp"&&p.length===1)return list("yp");if(p[0]==="categories")return categoryPage();if(p[0]==="favorites")return favorites();if(p[0]==="settings")return settings();if((p[0]==="hymns"||p[0]==="yp")&&(p[1]==="my"||p[1]==="en")&&p[2])return reader(p[0],p[1],decodeURIComponent(p[2]));return list("hymns")}
document.addEventListener("click",e=>{const a=e.target.closest("a[href]");if(!a||a.origin!==location.origin)return;e.preventDefault();history.pushState({},"",a.pathname+a.search);route()});addEventListener("popstate",route);
(async()=>{try{const db=await openDb(),tx=db.transaction([HYMNS,CATEGORIES,META]);[hymns,categories]=await Promise.all([all(tx.objectStore(HYMNS)),all(tx.objectStore(CATEGORIES))]);meta=await new Promise((ok,no)=>{const r=tx.objectStore(META).get("library");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});db.close();if(!meta||!hymns.length)throw Error();route()}catch{app.innerHTML=`<section class="surface empty"><h1>Offline library not downloaded</h1><p class="muted">Connect to the internet, open Settings, and choose Download library.</p></section>`}})();
  </script>
</body>
</html>
